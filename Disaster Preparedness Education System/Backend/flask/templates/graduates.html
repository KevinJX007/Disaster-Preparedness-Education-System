<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hero Graduates</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #e0f7fa; text-align: center; padding: 20px; }
        h1 { font-family: 'Bungee'; color: #00AEEF; font-size: 3rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        ul { list-style: none; padding: 0; }
        li { background: #fffde7; margin: 10px 0; padding: 15px; border-bottom: 2px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .name { font-weight: bold; font-size: 1.2rem; color: #333; }
        .time { font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <h1>🏅 ACADEMY GRADUATES</h1>
    <div class="container">
        <ul>
            {% for student in students %}
                <li>
                    <span class="name">🦸 {{ student[0] }}</span>
                    <span class="time">{{ student[1] }}</span>
                </li>
            {% else %}
                <p>No graduates yet. Be the first to finish!</p>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
