<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Academy | Disaster Prep</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pop-yellow: #FFDE17; --pop-blue: #00AEEF; --pop-pink: #EC008C;
            --pop-green: #7AC143; --pop-orange: #F7941D; --pop-purple: #9b59b6;
            --white: #FFFFFF; --dark: #231F20;
        }

        body { 
            margin: 0; font-family: 'Nunito', sans-serif; 
            background: radial-gradient(circle, #6190E8, #A7BFE8);
            color: var(--dark); min-height: 100vh; overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Bungee', cursive; text-shadow: 3px 3px 0px rgba(0,0,0,0.1); }

        /* --- Screens --- */
        .screen { display: none; padding: 40px 20px; flex-direction: column; align-items: center; text-align: center; }
        .active { display: flex; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- UI Elements --- */
        .btn {
            background: var(--pop-yellow); border: 4px solid var(--dark);
            padding: 15px 30px; font-family: 'Bungee'; font-size: 1.1rem;
            border-radius: 50px; cursor: pointer; transition: 0.2s;
            box-shadow: 6px 6px 0px var(--dark); margin: 10px;
        }
        .btn:hover { transform: scale(1.05); background: var(--white); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 1100px; margin-top: 20px; }
        
        .card {
            background: var(--white); border: 4px solid var(--dark);
            border-radius: 25px; padding: 20px; box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
            transition: 0.3s; position: relative;
        }
        .card.completed { border-color: var(--pop-green); background: #f0fff0; }
        .card.completed::after { content: "✅"; position: absolute; top: 10px; right: 10px; font-size: 25px; }

        .hidden { display: none !important; }

        /* --- Mascot & Bubble --- */
        #mascot-container { position: fixed; bottom: 20px; left: 20px; z-index: 100; text-align: center; }
        #bubble { 
            background: white; border: 3px solid var(--dark); border-radius: 20px; 
            padding: 10px; margin-bottom: 10px; max-width: 200px; font-weight: bold;
            position: relative; box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }

        /* --- Certificate --- */
        #certificate {
            width: 700px; padding: 40px; background: white; border: 15px double var(--pop-orange);
            text-align: center; display: none; margin: 20px auto; position: relative;
        }
    </style>
</head>
<body>

    <div id="mascot-container">
        <div id="bubble" class="hidden"></div>
        <div id="mascot" style="font-size: 60px;">🐶</div>
    </div>

    <section id="login-screen" class="screen active">
        <div style="font-size: 80px;">⭐</div>
        <h1>HERO ACADEMY</h1>
        
        <input type="text" id="username" placeholder="Hero Name..." 
               style="padding:15px; border-radius:15px; width:250px; border:3px solid var(--dark); margin-bottom: 10px;">
        <br>
        
        <input type="email" id="email" placeholder="Hero Email..." 
               style="padding:15px; border-radius:15px; width:250px; border:3px solid var(--dark); margin-bottom: 10px;">
        <br>

        <button class="btn" onclick="startApp()">START MISSION</button>
    </section>

   <section id="dashboard-screen" class="screen">
        <h2>MISSION CONTROL: <span id="hero-name" style="color: var(--pop-pink);">HERO</span></h2>
        
        <div id="progress-container" style="width: 80%; background: #ddd; height: 30px; border-radius: 15px; border: 3px solid var(--dark); overflow:hidden; margin: 20px;">
            <div id="progress-fill" style="height:100%; width:0%; background: var(--pop-green); transition: 0.5s;"></div>
        </div>
        
        <p>Modules Finished: <span id="count">0</span> / 5</p>
        
        <div class="grid" id="module-grid"></div>

        <div style="margin-top: 30px; display: flex; gap: 20px; justify-content: center;">
            <button id="cert-btn" class="btn" style="display:none; background: var(--pop-orange);" onclick="generateCertificate()">
                🏆 CLAIM CERTIFICATE
            </button>
            
            <a href="/graduates" class="btn" style="background: var(--pop-purple); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                📜 HALL OF FAME
            </a>
        </div>
    </section>

    <section id="learning-screen" class="screen">
        <div id="timer-display" style="font-family:'Bungee'; color:var(--pop-pink); font-size:1.5rem; margin-bottom:15px; text-shadow: 2px 2px 0px #000;">
            ⏳ TIME LEFT: 15s
        </div>

        <div class="info-box" id="game-info-box" style="background: white; padding: 30px; border-radius: 30px; border: 4px solid var(--pop-blue); max-width: 700px;">
            <h2 id="dis-title"></h2>
            <p id="dis-def" style="font-weight: bold; font-size: 1.1rem; color: #555;"></p>
            <hr style="border: 2px dashed var(--pop-blue); margin: 20px 0;">
            <h3 id="quiz-q" style="color: var(--dark);"></h3>
            <div id="quiz-options"></div>
        </div>
        
        <button class="btn" style="background: #ccc; margin-top:20px;" onclick="showScreen('dashboard-screen')">ABORT MISSION</button>
    </section>

    <section id="cert-screen" class="screen">
        <div id="certificate">
            <h1 style="color: var(--pop-orange); font-size: 3rem;">CERTIFICATE</h1>
            <p style="font-size: 1.5rem;">This honors the bravery of</p>
            <h2 id="cert-hero-name" style="font-size: 2.5rem; text-decoration: underline;"></h2>
            <p style="font-size: 1.2rem;">For completing the official <br><strong>Disaster Preparedness Training</strong></p>
            <div class="cert-seal" style="font-size: 80px; margin: 20px 0;">🏅</div>
            <p>Date: <span id="cert-date"></span></p>
        </div>
        <button class="btn" onclick="window.print()">🖨️ PRINT CERTIFICATE</button>
        <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
    </section>

    <script>
        const disasterData = {
            earthquake: {
                title: "Earthquake Mission", icon: "🌋",
                def: "When the Earth's plates move, the ground shakes! Stay calm and protect your head.",
                questions: [
                    { q: "The ground starts shaking! What is the first thing you do?", a: ["Run for the door", "Drop, Cover, and Hold on!", "Call a friend"], c: 1 },
                    { q: "You are in bed during an earthquake. What should you do?", a: ["Stay there and protect your head with a pillow", "Hide under the bed", "Run to the kitchen"], c: 0 },
                    { q: "If you are outside when an earthquake hits, where should you go?", a: ["Under a big tree", "Next to a tall building", "An open area away from buildings"], c: 2 },
                    { q: "After the shaking stops, what should you expect?", a: ["A party", "Aftershocks (smaller shakes)", "Snowfall"], c: 1 },
                    { q: "In a store, what should you stay away from?", a: ["The exit", "Glass windows and heavy shelves", "The floor"], c: 1 }
                ]
            },
            fire: {
                title: "Fire Safety Mission", icon: "🔥",
                def: "Fire is fast! Staying low and having an escape plan is your superpower.",
                questions: [
                    { q: "What should you do if your clothes catch fire?", a: ["Run and scream", "Stop, Drop, and Roll", "Cover with a blanket"], c: 1 },
                    { q: "How should you check if a closed door is hot?", a: ["Palm of your hand", "Kick it", "Back of your hand"], c: 2 },
                    { q: "Where is the cleanest air in a smoky room?", a: ["Near the ceiling", "Middle of the room", "Near the floor (crawl)"], c: 2 },
                    { q: "A 'Meeting Place' is...", a: ["A spot outside to meet your family", "Where you play tag", "Under the bed"], c: 0 },
                    { q: "How often should you practice a fire drill?", a: ["Every 10 years", "Twice a year", "Never"], c: 1 }
                ]
            },
            flood: {
                title: "Flood Alert Mission", icon: "🌊",
                def: "Rising waters are powerful. Never walk or drive through flood water!",
                questions: [
                    { q: "What is the Hero rule for flooded roads?", a: ["Swim fast", "Turn around, don't drown", "Walk slowly"], c: 1 },
                    { q: "Why is flood water dangerous?", a: ["It's too cold", "It hides sharp objects/dirt", "It has fish"], c: 1 },
                    { q: "Where should you go if water enters your house?", a: ["The basement", "Highest floor", "The garage"], c: 1 },
                    { q: "Electrical items in a flood should be...", a: ["Turned on", "Unplugged (if safe)", "Put in water"], c: 1 },
                    { q: "6 inches of fast water can...", a: ["Knock an adult over", "Be a nice bath", "Make you fly"], c: 0 }
                ]
            },
            pandemic: {
                title: "Pandemic Awareness", icon: "🦠",
                def: "Fight tiny germs with soap and space! Heroes keep everyone healthy.",
                questions: [
                    { q: "How long should you wash your hands?", a: ["5 seconds", "Until they look clean", "20 seconds"], c: 2 },
                    { q: "Sneeze coming? What do you do?", a: ["Use your hands", "Use your elbow", "Just sneeze in the air"], c: 1 },
                    { q: "Social distancing helps...", a: ["To be mean", "Stop germs jumping", "Because we are playing tag"], c: 1 },
                    { q: "Best way to clean a desk?", a: ["Blow on it", "Disinfectant wipes", "Your sleeve"], c: 1 },
                    { q: "A mask protects...", a: ["Your pet", "Everyone around you", "Your toys"], c: 1 }
                ]
            },
            storm: {
                title: "Storm & Tornado Mission", icon: "🌪️",
                def: "High winds and thunder! Find the strongest part of your home.",
                questions: [
                    { q: "Safest place during a tornado?", a: ["Kitchen", "Near a window", "Basement/Inside room"], c: 2 },
                    { q: "Emergency Kit essential?", a: ["Video games", "Water, flashlight, first aid", "Heavy TV"], c: 1 },
                    { q: "Hear thunder?", a: ["Go inside immediately", "Go swimming", "Stand under a tree"], c: 0 },
                    { q: "A Tornado 'Watch' means...", a: ["One is here now", "Conditions are right for one", "A storm movie"], c: 1 },
                    { q: "In a car during a tornado?", a: ["Drive faster", "Find a low ditch/ground", "Hide under the seat"], c: 1 }
                ]
            }
        };

        let heroName = "";
        let completedModules = [];
        let currentQuizData = [];
        let currentQIndex = 0;
        let currentKey = "";
        let timeLeft = 15;
        let timerInterval;

        function talk(text) {
            const bubble = document.getElementById('bubble');
            bubble.innerText = text;
            bubble.classList.remove('hidden');
            setTimeout(() => bubble.classList.add('hidden'), 4000);
        }

       async function startApp() {
            heroName = document.getElementById('username').value;
            let Email = document.getElementById('email').value; // <--- NEW

            if(!heroName || !Email) return alert("Please enter both Name and Email!");

            try {
                // Send BOTH name and email to Python
                const response = await fetch('http://127.0.0.1:5000/register_hero', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: heroName, 
                        email: Email  // <--- NEW
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    console.log("Server says:", result.message);
                    talk("Hero registered in Database!");
                } else {
                    alert("Database Error: " + result.error);
                    return; 
                }

            } catch (error) {
                alert("Could not connect to the server!");
                return;
            }

            document.getElementById('hero-name').innerText = heroName.toUpperCase();
            renderDashboard();
            showScreen('dashboard-screen');
            talk("Welcome to the Academy, Hero!");
        }
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id !== 'learning-screen') clearInterval(timerInterval);
        }

        function startModule(key) {
            currentKey = key;
            currentQuizData = disasterData[key].questions;
            currentQIndex = 0;
            document.getElementById('dis-title').innerText = disasterData[key].title;
            document.getElementById('dis-def').innerText = disasterData[key].def;
            showScreen('learning-screen');
            loadQuestion();
        }

        function startTimer() {
            timeLeft = 15;
            const display = document.getElementById('timer-display');
            display.innerText = `⏳ TIME LEFT: ${timeLeft}s`;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                display.innerText = `⏳ TIME LEFT: ${timeLeft}s`;
                if(timeLeft <= 5) {
                    display.style.color = "red";
                    display.style.transform = "scale(1.2)";
                } else {
                    display.style.color = "var(--pop-pink)";
                    display.style.transform = "scale(1.0)";
                }
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏰ TIME IS UP! Speed is key for a Hero. Restarting mission!");
                    startModule(currentKey);
                }
            }, 1000);
        }

        function loadQuestion() {
            startTimer();
            const q = currentQuizData[currentQIndex];
            document.getElementById('quiz-q').innerText = `Challenge ${currentQIndex + 1}/5: ${q.q}`;
            const options = document.getElementById('quiz-options');
            options.innerHTML = "";
            q.a.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = "btn"; b.style.width = "100%";
                b.innerText = opt;
                b.onclick = () => checkAns(i);
                options.appendChild(b);
            });
        }

        function checkAns(choice) {
            if(choice === currentQuizData[currentQIndex].c) {
                currentQIndex++;
                if(currentQIndex < currentQuizData.length) {
                    talk("Excellent choice!");
                    loadQuestion();
                } else {
                    clearInterval(timerInterval);
                    alert("🏆 MISSION MASTERED!");
                    if(!completedModules.includes(currentKey)) completedModules.push(currentKey);
                    renderDashboard();
                    showScreen('dashboard-screen');
                    talk("One step closer to the certificate!");
                }
            } else {
                talk("Watch out! That's dangerous!");
                alert("❌ Not safe! Try again!");
            }
        }

        function renderDashboard() {
            const grid = document.getElementById('module-grid');
            grid.innerHTML = "";
            for (let key in disasterData) {
                const isDone = completedModules.includes(key);
                grid.innerHTML += `
                    <div class="card ${isDone ? 'completed' : ''}">
                        <div style="font-size:40px">${disasterData[key].icon}</div>
                        <h3>${disasterData[key].title}</h3>
                        <button class="btn" onclick="startModule('${key}')" ${isDone ? 'style="background:#7AC143"' : ''}>
                            ${isDone ? 'MASTERED ✅' : 'START MISSION'}
                        </button>
                    </div>`;
            }
            updateProgress();
        }

        function updateProgress() {
            const total = Object.keys(disasterData).length;
            const current = completedModules.length;
            document.getElementById('count').innerText = current;
            document.getElementById('progress-fill').style.width = (current / total * 100) + "%";
            if(current === total) document.getElementById('cert-btn').style.display = "block";
        }

        async function generateCertificate() {
            // UI Logic
            document.getElementById('cert-hero-name').innerText = heroName.toUpperCase();
            document.getElementById('cert-date').innerText = new Date().toLocaleDateString();
            document.getElementById('certificate').style.display = "block";
            showScreen('cert-screen');

            // Backend Logic: Save to graduates table
            try {
                await fetch('http://127.0.0.1:5000/mark_complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: heroName })
                });
                console.log("Added to graduates list!");
            } catch (error) {
                console.error("Error saving graduate:", error);
            }
        }
    </script>
</body>
</html>
